<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ── Favicon ── -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Viewport + theme ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06060e" />

    <!-- ── Primary SEO ── -->
    <title>Paragon Web Studio — AI Websites That Sell for You</title>
    <meta
      name="description"
      content="Paragon builds high-converting websites with built-in AI receptionists and automation. From kickoff to live site in 7 days. 14-day money-back guarantee."
    />
    <meta name="keywords" content="AI website design, web design agency, AI receptionist, website automation, local business website, conversion-focused website, 7 day website" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://paragonweb.studio/" />

    <!-- ── Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://paragonweb.studio/" />
    <meta property="og:title" content="Paragon Web Studio — AI Websites That Sell for You" />
    <meta
      property="og:description"
      content="High-converting websites with AI receptionists, built in 7 days. Serving service businesses ready to scale online."
    />
    <meta property="og:image" content="https://paragonweb.studio/og-image.jpg" />
    <meta property="og:site_name" content="Paragon Web Studio" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@paragonwebstudio" />
    <meta name="twitter:title" content="Paragon Web Studio — AI Websites That Sell for You" />
    <meta
      name="twitter:description"
      content="High-converting websites with AI receptionists, built in 7 days."
    />
    <meta name="twitter:image" content="https://paragonweb.studio/og-image.jpg" />

    <!-- ── Performance: preconnect ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://calendly.com" />
    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ── Google Analytics (replace GA_MEASUREMENT_ID) ── -->
    <!-- Replace REACT_APP_GA_ID in .env with your actual GA4 Measurement ID -->
    <!-- Example: G-XXXXXXXXXX -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    -->

    <!-- ── JSON-LD: Organization ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Paragon Web Studio",
      "url": "https://paragonweb.studio",
      "logo": "https://paragonweb.studio/logo192.png",
      "description": "AI-powered websites and automation that turn visitors into clients, built in 7 days.",
      "email": "hello@paragonweb.studio",
      "sameAs": [
        "https://twitter.com/paragonwebstudio",
        "https://instagram.com/paragonwebstudio",
        "https://linkedin.com/company/paragonwebstudio"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter Website",
          "price": "500",
          "priceCurrency": "USD",
          "description": "3-page mobile-first website with basic SEO and contact form."
        },
        {
          "@type": "Offer",
          "name": "Launch Pro Website",
          "price": "1500",
          "priceCurrency": "USD",
          "description": "5-page website with AI chat widget, CMS, advanced SEO, and 30-day support."
        },
        {
          "@type": "Offer",
          "name": "Growth Retainer",
          "price": "2500",
          "priceCurrency": "USD",
          "description": "Launch Pro plus monthly SEO, email automation, analytics, and growth ops."
        }
      ]
    }
    </script>

    <!-- ── JSON-LD: FAQ ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How long does it take to build my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our standard delivery is 7 business days from the kickoff call. We have a structured sprint process — no waiting around for weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a money-back guarantee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every project comes with a 14-day money-back guarantee. If you're not satisfied and we can't resolve it through revisions, we'll refund your payment — no questions asked."
          }
        },
        {
          "@type": "Question",
          "name": "What does the AI Receptionist do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The AI Receptionist is a custom-trained chatbot that answers FAQs, collects lead info, qualifies prospects, and books appointments directly to your calendar. It works 24/7 via website chat and SMS."
          }
        },
        {
          "@type": "Question",
          "name": "Can I update my website myself after launch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every Launch Pro and Growth site includes a CMS so you can edit text, images, blog posts, and pricing without touching code."
          }
        }
      ]
    }
    </script>

    <!-- ── JSON-LD: Local Business / Service ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Paragon Web Studio",
      "url": "https://paragonweb.studio",
      "image": "https://paragonweb.studio/og-image.jpg",
      "priceRange": "$$$",
      "serviceType": "Web Design & AI Automation",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Paragon Services",
        "itemListElement": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "AI Website Build"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "AI Receptionist"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Growth Ops Retainer"}}
        ]
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Skip navigation for screen readers -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root"></div>
  </body>
</html>
